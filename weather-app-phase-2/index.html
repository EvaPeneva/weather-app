<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>

    <!-- Main CSS file -->
    <link rel="stylesheet" href="styles.css">

    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <main class="weather-app">
        <section class="app-card">
            <div class="app-header">
                <p class="eyebrow">JavaScript · HTML · CSS</p>
                <h1>Weather App</h1>
            </div>

            <form id="search-form" class="search-form">
                <label for="city-input">Въведи град:</label>
                <div class="search-row">
                    <input
                        type="text"
                        id="city-input"
                        placeholder="Напр. Sofia, London, Paris"
                        autocomplete="off"
                    >
                    <button type="submit">Търси</button>
                </div>
            </form>

            <div class="toolbar">
                <button type="button" id="unit-toggle" class="secondary-button">Покажи във °F</button>
            </div>

            <section id="history-section" class="history-section hidden" aria-label="История на търсенията">
                <p>Последни търсения:</p>
                <div id="history-list" class="history-list"></div>
            </section>

            <p id="loading" class="loading hidden">
                <i class="fa-solid fa-spinner"></i>
                Зареждане на данни...
            </p>

            <p id="error-message" class="error-message hidden"></p>

            <section id="weather-result" class="weather-result hidden" aria-live="polite">
                <div class="city-line">
                    <h2 id="city-name">--</h2>
                    <span id="country-name" class="country-name">--</span>
                </div>

                <div class="weather-main">
                    <div id="weather-icon-badge" class="weather-icon-badge theme-cloudy">
                        <i id="weather-icon" class="fa-solid fa-cloud-sun weather-icon"></i>
                    </div>
                    <div>
                        <p id="temperature" class="temperature">--°C</p>
                        <p id="weather-condition" class="weather-condition">--</p>
                    </div>
                </div>

                <div class="weather-details">
                    <div class="detail-box">
                        <span>Вятър</span>
                        <strong id="wind-speed">-- km/h</strong>
                    </div>
                    <div class="detail-box">
                        <span>Координати</span>
                        <strong id="coordinates">--</strong>
                    </div>
                </div>
            </section>

            <section id="forecast-section" class="forecast-section hidden" aria-label="5-дневна прогноза">
                <div class="forecast-header">
                    <div>
                        <p class="section-eyebrow">Прогноза</p>
                        <h2>Следващи 5 дни</h2>
                    </div>
                    <span class="forecast-note">min / max</span>
                </div>
                <div id="forecast-list" class="forecast-list"></div>
            </section>
        </section>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
